<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KOMBAT Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
    <div class="status-bar">
        <div id="p1-stats" class="player-stats p1">P1 Budget: 0</div>
        <div class="turn-info">Turn: <span id="turn-count">1</span></div>
        <div id="p2-stats" class="player-stats p2">P2 Budget: 0</div>
    </div>

    <div id="hex-grid" class="hex-grid"></div>

    <div class="controls">
        <button onclick="endTurn()" class="btn-end">End Turn</button>
    </div>

    <div id="game-log" class="log-panel">Game Started...</div>
</div>

<script src="game.js"></script>
</body>
</html>
